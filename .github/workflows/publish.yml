name: Release Windows reader
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  validate:
    uses: ./.github/workflows/windows.yml
  publish:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: release-assets
      - name: Validate version and checksums
        run: |
          VERSION=$(node -p "require('./package.json').version")
          test "$GITHUB_REF_NAME" = "v$VERSION"
          cd release-assets
          sha256sum --check SHA256SUMS.txt
      - name: Publish verified installer and portable package
        run: |
          gh release create "$GITHUB_REF_NAME" release-assets/* --verify-tag --target "$GITHUB_SHA" --draft --prerelease --title "mitotoReader $GITHUB_REF_NAME" --notes-file docs/release-notes.md
          gh api "repos/$GH_REPO/releases" > releases.json
          python3 - <<'PY'
          import hashlib, json, pathlib, os
          release = next(r for r in json.load(open('releases.json')) if r['tag_name'] == os.environ['GITHUB_REF_NAME'])
          files = list(pathlib.Path('release-assets').iterdir())
          assert len(release['assets']) == len(files) == 4
          for file in files:
              asset = next(a for a in release['assets'] if a['name'] == file.name)
              assert asset['size'] == file.stat().st_size
              assert asset['digest'] == 'sha256:' + hashlib.sha256(file.read_bytes()).hexdigest()
          pathlib.Path('release-id.txt').write_text(str(release['id']))
          PY
          RELEASE_ID=$(cat release-id.txt)
          gh api --method PATCH "repos/$GH_REPO/releases/$RELEASE_ID" -F draft=false > /dev/null
